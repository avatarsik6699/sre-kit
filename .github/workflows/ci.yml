name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go and web quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Check Go formatting
        run: test -z "$(find cmd internal adapters -type f -name '*.go' -print0 | xargs -0 gofmt -l)"

      - name: Vet Go packages
        run: go vet ./...

      - name: Verify Go modules
        run: go mod verify

      - name: Test Go packages
        run: go test ./...

      - name: Install API documentation generator
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6

      - name: Check generated API contract
        run: |
          export PATH="$PWD/web/node_modules/.bin:$PATH"
          node scripts/api-contracts.mjs --check

      - name: Lint web client
        run: pnpm --dir web lint

      - name: Build web client
        run: pnpm --dir web build

      - name: Type-check web client
        run: pnpm --dir web typecheck

      - name: Test web client
        run: pnpm --dir web test
